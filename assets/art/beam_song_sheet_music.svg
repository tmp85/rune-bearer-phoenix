<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#fefefe" stroke="#ddd" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Beam Song - Wells Day 18
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="65" text-anchor="middle" font-family="serif" font-size="14" fill="#7f8c8d">
    Play 3 times - Mark IRL Done after third repetition
  </text>
  
  <!-- Staff lines -->
  <g stroke="#333" stroke-width="1.5">
    <!-- Treble staff -->
    <line x1="80" y1="120" x2="720" y2="120"/> <!-- E line -->
    <line x1="80" y1="140" x2="720" y2="140"/> <!-- C line -->
    <line x1="80" y1="160" x2="720" y2="160"/> <!-- A line -->
    <line x1="80" y1="180" x2="720" y2="180"/> <!-- F line -->
    <line x1="80" y1="200" x2="720" y2="200"/> <!-- D line -->
  </g>
  
  <!-- Treble clef -->
  <text x="100" y="170" font-family="serif" font-size="60" fill="#2c3e50">𝄞</text>
  
  <!-- Time signature 4/4 -->
  <text x="140" y="155" font-family="serif" font-size="24" fill="#2c3e50">4</text>
  <text x="140" y="185" font-family="serif" font-size="24" fill="#2c3e50">4</text>
  
  <!-- Bar line after time signature -->
  <line x1="170" y1="120" x2="170" y2="200" stroke="#333" stroke-width="2"/>
  
  <!-- Notes -->
  <!-- C (quarter note on C line) -->
  <circle cx="200" cy="140" r="8" fill="#2c3e50"/>
  <rect x="208" y="90" width="2" height="50" fill="#2c3e50"/>
  <text x="190" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">C</text>
  <text x="190" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">1</text>
  
  <!-- C (quarter note on C line) -->
  <circle cx="240" cy="140" r="8" fill="#2c3e50"/>
  <rect x="248" y="90" width="2" height="50" fill="#2c3e50"/>
  <text x="230" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">C</text>
  <text x="230" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">1</text>
  
  <!-- E♭ (quarter note on E line with flat) -->
  <text x="270" y="115" font-family="serif" font-size="16" fill="#2c3e50">♭</text>
  <circle cx="280" cy="120" r="8" fill="#2c3e50"/>
  <rect x="288" y="70" width="2" height="50" fill="#2c3e50"/>
  <text x="270" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">E♭</text>
  <text x="270" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">3</text>
  
  <!-- G (quarter note in space above staff) -->
  <circle cx="320" cy="100" r="8" fill="#2c3e50"/>
  <rect x="328" y="50" width="2" height="50" fill="#2c3e50"/>
  <text x="310" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">G</text>
  <text x="310" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">5</text>
  
  <!-- F (quarter note on F line) -->
  <circle cx="380" cy="180" r="8" fill="#2c3e50"/>
  <rect x="388" y="130" width="2" height="50" fill="#2c3e50"/>
  <text x="370" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">F</text>
  <text x="370" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">4</text>
  
  <!-- E♭ (quarter note on E line with flat) -->
  <text x="410" y="115" font-family="serif" font-size="16" fill="#2c3e50">♭</text>
  <circle cx="420" cy="120" r="8" fill="#2c3e50"/>
  <rect x="428" y="70" width="2" height="50" fill="#2c3e50"/>
  <text x="410" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">E♭</text>
  <text x="410" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">3</text>
  
  <!-- D (quarter note on D line) -->
  <circle cx="460" cy="200" r="8" fill="#2c3e50"/>
  <rect x="468" y="150" width="2" height="50" fill="#2c3e50"/>
  <text x="450" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">D</text>
  <text x="450" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">2</text>
  
  <!-- C (quarter note on C line) -->
  <circle cx="500" cy="140" r="8" fill="#2c3e50"/>
  <rect x="508" y="90" width="2" height="50" fill="#2c3e50"/>
  <text x="490" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#7f8c8d">C</text>
  <text x="490" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#e74c3c">1</text>
  
  <!-- End bar line -->
  <line x1="540" y1="120" x2="540" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="545" y1="120" x2="545" y2="200" stroke="#333" stroke-width="4"/>
  
  <!-- Fingering legend -->
  <text x="80" y="280" font-family="serif" font-size="14" font-weight="bold" fill="#2c3e50">Right Hand Fingering:</text>
  <text x="80" y="300" font-family="serif" font-size="12" fill="#7f8c8d">1 = Thumb  |  2 = Index  |  3 = Middle  |  4 = Ring  |  5 = Pinky</text>
  
  <!-- Practice instructions -->
  <text x="80" y="330" font-family="serif" font-size="14" font-weight="bold" fill="#2c3e50">Practice Instructions:</text>
  <text x="80" y="350" font-family="serif" font-size="12" fill="#7f8c8d">1st time: Play slowly  |  2nd time: Moderate speed  |  3rd time: Confident rhythm</text>
  
  <!-- Moonbeam decoration -->
  <text x="600" y="150" font-family="serif" font-size="40" fill="#f1c40f" opacity="0.7">🌙</text>
  <text x="650" y="130" font-family="serif" font-size="30" fill="#3498db" opacity="0.7">✨</text>
  <text x="680" y="170" font-family="serif" font-size="25" fill="#9b59b6" opacity="0.7">🎵</text>
</svg>